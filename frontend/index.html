<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- An installed app: no page zoom (pinch, double tap, focus), drawn edge to edge under the notch and the home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07090D" />
    <meta name="format-detection" content="telephone=no" />
    <title>LiquidityDissection — gold & forex</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="LiquidityD" />
    <meta name="description" content="LiquidityDissection — Private Desk: live gold and forex charts, prices and economic news." />
    <meta property="og:title" content="LiquidityDissection — Private Desk" />
    <meta property="og:description" content="Live gold and forex charts, prices and economic news." />
    <meta property="og:image" content="/brand/logo-full.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* The intro: the logo video (brand/intro-*.mp4, 10 s) plays in full at every opening of the app, on a phone (square cut)
         as on a computer (16:9), on the video's own background; src/splash.ts fades it out once it has ended AND the
         app is ready underneath. */
      html, body { margin: 0; background: #07090D; height: 100%; overscroll-behavior: none; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #0B1018; transition: opacity .8s ease-in-out, visibility .8s; }  /* the logo's own background */
      #splash.fade-out { opacity: 0; visibility: hidden; }
      #splash video { width: 100%; height: 100%; object-fit: cover; display: block; background: #0B1018; }
      #splash video.is-square { object-fit: contain; }
      @keyframes ld-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      /* the loaders inside the app (same logo, smaller, spinning gold arc) */
      .ld-logo-loader { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
      .ld-logo-loader .ld-circle { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(214, 174, 87, .1);
        border-top-color: #D6AE57; animation: ld-spin 1.5s linear infinite; }
      .ld-logo-loader img { width: 62%; height: 62%; animation: ld-breathe 2.6s ease-in-out infinite; }
      .ld-logo-loader.is-small { width: 72px; height: 72px; }
      .ld-logo-loader.is-small .ld-circle { border-width: 2px; }
      @keyframes ld-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .ld-logo-loader .ld-circle { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Loading"><video id="intro" muted playsinline autoplay preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true"></video></div>
    <script>
      // The intro video: the square cut on a tall screen (a phone), the 16:9 one otherwise. Muted + playsinline so phones
      // play it by themselves. It ends the intro when it ends; if the phone refuses to play it (power saving) or it cannot
      // load, the intro ends soon after, and never later than 16 s (a slow network must not trap anyone).
      (function () {
        var v = document.getElementById('intro');
        var end = function () { if (window.__ldIntroDone) return; window.__ldIntroDone = true; window.dispatchEvent(new Event('ld-intro-end')); };
        if (!v) { end(); return; }
        var cut = window.innerHeight > window.innerWidth * 1.05 ? 'square' : 'wide';
        v.className = 'is-' + cut;
        v.poster = '/brand/intro-' + cut + '.jpg';
        v.src = '/brand/intro-' + cut + '.mp4';
        v.addEventListener('ended', end);
        v.addEventListener('error', function () { setTimeout(end, 1500); });
        var p = v.play();
        if (p && p.catch) p.catch(function () { setTimeout(end, 2500); });
        setTimeout(end, 16000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
