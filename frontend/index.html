<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- An installed app: no page zoom (pinch, double tap, focus), drawn edge to edge under the notch and the home bar -->

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07090D" />
    <meta name="format-detection" content="telephone=no" />
    <title>LiquidityDissection — gold & forex signals</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="LiquidityD" />
    <link rel="preload" as="image" href="/brand/emblem-clear-512.webp" type="image/webp" />
    <meta name="description" content="LiquidityDissection — Private Desk: gold H1 breakout and FXAlexG Set &amp; Forget GPA forex signals, live charts, Telegram signals with your own lot." />
    <meta property="og:title" content="LiquidityDissection — Private Desk" />
    <meta property="og:description" content="Gold and forex signals, live charts and a personal trade journal." />
    <meta property="og:image" content="/brand/logo-full.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* The intro (3.8 s, held at least 4 s while the app gathers its data underneath): a gold circle appears, the app's
         logo shows inside it, then comes out whole as the circle fades, glows, and a sparkle lights the tip of its arrow
         (src/splash.ts fades the whole intro out once the app is ready). */
      html, body { margin: 0; background: #07090D; height: 100%; overscroll-behavior: none; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #0E121A; transition: opacity .8s ease-in-out, visibility .8s; }  /* the logo's own background */
      #splash.fade-out { opacity: 0; visibility: hidden; }
      .ld-intro { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
      /* 1. the circle that appears first, then opens out and fades */
      .ld-intro-circle { position: absolute; width: 210px; height: 210px; border-radius: 50%; border: 2px solid #C59B27; opacity: 0;
        box-shadow: 0 0 15px rgba(212, 175, 55, .2); animation: ld-circle 3.8s ease-in-out forwards; pointer-events: none; z-index: 2; }
      /* 2. the logo: shown inside the circle first, then whole */
      .ld-intro-logo { position: relative; width: 220px; height: 220px; clip-path: circle(0% at 50% 50%);
        animation: ld-reveal 3.8s cubic-bezier(.4, 0, .2, 1) forwards; }
      .ld-intro-logo img { width: 100%; height: 100%; object-fit: contain; display: block; animation: ld-glow-pulse 3.8s ease-in-out forwards; }
      /* 3. the sparkle on the tip of the arrow (84% / 11% of the logo) */
      .ld-intro-spark { position: absolute; left: calc(50% - 110px + 220px * .84 - 7px); top: calc(50% - 110px + 220px * .113 - 7px);
        width: 14px; height: 14px; border-radius: 50%; opacity: 0; z-index: 3;
        background: radial-gradient(circle, #fff 10%, #ffd700 50%, transparent 70%); animation: ld-sparkle 3.8s ease-in-out forwards; }
      .ld-intro-spark::before, .ld-intro-spark::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
      .ld-intro-spark::before { width: 28px; height: 2px; background: linear-gradient(90deg, transparent, #fff, transparent); }
      .ld-intro-spark::after { width: 2px; height: 28px; background: linear-gradient(180deg, transparent, #fff, transparent); }
      @keyframes ld-circle { 0% { opacity: 0; transform: scale(.85); } 15% { opacity: .4; transform: scale(1); }
        35% { opacity: 1; border-width: 4px; box-shadow: 0 0 20px rgba(212, 175, 55, .5); } 55% { opacity: 1; transform: scale(1); }
        70% { opacity: 0; transform: scale(1.1); } 100% { opacity: 0; } }
      @keyframes ld-reveal { 0%, 15% { clip-path: circle(0% at 50% 50%); opacity: 0; } 35% { clip-path: circle(46% at 50% 50%); opacity: .85; }
        55% { clip-path: circle(46% at 50% 50%); opacity: 1; } 75%, 100% { clip-path: circle(85% at 50% 50%); opacity: 1; } }
      @keyframes ld-glow-pulse { 0%, 50% { filter: drop-shadow(0 0 0 rgba(212, 175, 55, 0)); }
        75% { filter: drop-shadow(0 0 18px rgba(255, 205, 70, .9)) brightness(1.15); }
        90%, 100% { filter: drop-shadow(0 0 8px rgba(212, 175, 55, .5)) brightness(1); } }
      @keyframes ld-sparkle { 0%, 55% { opacity: 0; transform: scale(0) rotate(0deg); } 75% { opacity: 1; transform: scale(1.3) rotate(45deg); }
        90% { opacity: .9; transform: scale(1) rotate(90deg); } 100% { opacity: .7; transform: scale(.8) rotate(90deg); } }
      @keyframes ld-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      /* the loaders inside the app (same logo, smaller, spinning gold arc) */
      .ld-logo-loader { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
      .ld-logo-loader .ld-circle { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(214, 174, 87, .1);
        border-top-color: #D6AE57; animation: ld-spin 1.5s linear infinite; }
      .ld-logo-loader img { width: 62%; height: 62%; animation: ld-breathe 2.6s ease-in-out infinite; }
      .ld-logo-loader.is-small { width: 72px; height: 72px; }
      .ld-logo-loader.is-small .ld-circle { border-width: 2px; }
      @keyframes ld-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .ld-intro-logo { clip-path: none; animation: none; }
        .ld-intro-logo img, .ld-intro-circle { animation: none; }
        .ld-intro-spark { animation: none; opacity: .7; }
        .ld-logo-loader .ld-circle { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Loading"><div class="ld-intro"><div class="ld-intro-circle"></div><div class="ld-intro-logo"><img src="/brand/emblem-clear-512.webp" alt="" width="220" height="220" /></div><div class="ld-intro-spark"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
